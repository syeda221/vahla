<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.35"/>
  
  <!-- Modern Geometric Hexagon / Ring -->
  <polygon points="60,22 88,38 88,72 60,88 32,72 32,38" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25"/>
  
  <!-- 3 Stars -->
  <g fill="url(#goldGrad)">
    <!-- Left Star -->
    <polygon points="34,36 35.8,40.5 40.5,41 37,44.2 38,48.8 34,46.3 30,48.8 31,44.2 27.5,41 32.2,40.5"/>
    <!-- Center Star (Top) -->
    <polygon points="60,26 62.5,32 69,32.7 64,37.2 65.5,43.5 60,40.2 54.5,43.5 56,37.2 51,32.7 57.5,32"/>
    <!-- Right Star -->
    <polygon points="86,36 87.8,40.5 92.5,41 89,44.2 90,48.8 86,46.3 82,48.8 83,44.2 79.5,41 84.2,40.5"/>
  </g>
  
  <!-- Center Monogram -->
  <text x="60" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">TSM</text>
  
  <!-- Bottom Ribbon / Label -->
  <rect x="25" y="86" width="70" height="16" rx="8" fill="#ffffff" fill-opacity="0.2"/>
  <text x="60" y="97.5" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SOLUTIONS</text>
</svg>